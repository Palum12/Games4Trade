services:
  db:
    image: postgres:16-alpine
    volumes: 
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d Games4Trade"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    depends_on:
      db:
        condition: service_healthy
  client: {}

volumes: 
  postgres_data:
